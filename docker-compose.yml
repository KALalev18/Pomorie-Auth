name: pomorie

x-pomorie-env: &pomorie-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-pomorie}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pomorie}
  POSTGRES_DB: ${POSTGRES_DB:-pomorie}
  KAFKA_BOOTSTRAP: redpanda:9092
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pomorie-local}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-pomorie-local-secret}
  PSEUDONYM_KEY: ${PSEUDONYM_KEY:-local-demo-pseudonym-key}

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pomorie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pomorie}
      POSTGRES_DB: ${POSTGRES_DB:-pomorie}
    ports: ["${POSTGRES_HOST_PORT:-55432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 3s
      retries: 30

  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8080:8080"]
    depends_on:
      redpanda: { condition: service_healthy }

  # S3-compatible object store for photos (MinIO no longer publishes community images).
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -volume.max=5
    ports: ["8333:8333"]
    volumes:
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - s3data:/data

volumes:
  pgdata:
  s3data:
