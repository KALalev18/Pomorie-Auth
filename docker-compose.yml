name: pomorie

x-python: &python
  build: .
  image: pomorie-platform:local

x-pomorie-env: &pomorie-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-pomorie}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pomorie}
  POSTGRES_DB: ${POSTGRES_DB:-pomorie}
  KAFKA_BOOTSTRAP: redpanda:9092
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pomorie-local}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-pomorie-local-secret}
  PSEUDONYM_KEY: ${PSEUDONYM_KEY:-local-demo-pseudonym-key}
  DASHBOARD_DB_USER: ${DASHBOARD_DB_USER:-dashboard}
  DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:-dashboard-local}

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pomorie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pomorie}
      POSTGRES_DB: ${POSTGRES_DB:-pomorie}
    ports: ["${POSTGRES_HOST_PORT:-55432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --set redpanda.auto_create_topics_enabled=false
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 3s
      retries: 30

  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8080:8080"]
    depends_on:
      redpanda: { condition: service_healthy }

  # S3-compatible object store for photos (MinIO no longer publishes community images).
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    # Small volumes with room to grow: a new bucket allocates 7 volumes at once.
    command: >-
      server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
      -volume.max=50 -master.volumeSizeLimitMB=64
    ports: ["8333:8333"]
    volumes:
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - s3data:/data

  # One-shot setup: schema migrations, reference data and Kafka topics.
  migrate:
    <<: *python
    command: >-
      sh -c "python -m pomorie.db migrate && python -m pomorie.reference.load
      && python -m pomorie.kafka"
    environment: *pomorie-env
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }

  api:
    <<: *python
    command: uvicorn pomorie.api.app:app --host 0.0.0.0 --port 8000
    environment: *pomorie-env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
      seaweedfs: { condition: service_started }

  processor:
    <<: *python
    command: python -m pomorie.processing.consumer
    environment: *pomorie-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }

  # The reporting app (Vite dev server). Its node_modules live in a volume, not the repo.
  app:
    image: node:22.12.0-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
    depends_on:
      api: { condition: service_started }

  # Reads the analytics marts only, as the read-only "dashboard" login.
  dashboard:
    <<: *python
    command: streamlit run src/pomorie/dashboard/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    environment: *pomorie-env
    ports: ["8501:8501"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  dagster-webserver:
    <<: *python
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/home/workspace.yaml
    environment: *pomorie-env
    ports: ["${DAGSTER_PORT:-3030}:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  dagster-daemon:
    <<: *python
    command: dagster-daemon run -w /opt/dagster/home/workspace.yaml
    environment: *pomorie-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  # One-shot: seed three months of synthetic history (docker compose run --rm demo).
  demo:
    <<: *python
    command: python -m pomorie.demo
    environment: *pomorie-env
    profiles: ["demo"]
    depends_on:
      processor: { condition: service_started }

volumes:
  pgdata:
  s3data:
  app_node_modules:
