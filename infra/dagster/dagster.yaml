# Run, event-log and schedule storage in Postgres, so history survives container restarts.
storage:
  postgres:
    postgres_db:
      hostname: { env: POSTGRES_HOST }
      username: { env: POSTGRES_USER }
      password: { env: POSTGRES_PASSWORD }
      db_name: dagster
      port: 5432

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 4

telemetry:
  enabled: false
