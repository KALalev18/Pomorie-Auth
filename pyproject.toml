[project]
name = "pomorie"
version = "0.1.0"
description = "Data platform that turns citizen reports from Pomorie into validated, routed cases and city analytics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "confluent-kafka>=2.5",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema[format-nongpl]>=4.23",
    "osmium>=4.0",
    "pillow>=10.4",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "shapely>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.119",
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pomorie"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Bulgarian text and Cyrillic licence plates are part of the domain, not typos.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the docker compose services (Postgres, Redpanda, S3)"]
